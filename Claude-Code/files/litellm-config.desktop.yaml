# zim-claude · Claude Desktop integration — LiteLLM proxy config
#
#   Claude Desktop (Cowork / Chat / Code)
#        |  POST /v1/messages   Authorization: Bearer <master key>
#        v
#   LiteLLM :4002   (this config, started by start-desktop-proxy.sh)
#        |  OpenAI-style
#        v
#   Token Juice  ->  DeepSeek-V4.1-Flash
#
# Claude Desktop imposes two hard requirements on the gateway:
#
#   1. Every model_name MUST look like an Anthropic/Claude model
#      (contain "claude" or "anthropic"). Anything else is dropped
#      from the picker with:
#        inferenceModels: "X" is not an Anthropic model and was removed...
#      That is why DeepSeek is exposed under claude-* names below.
#
#   2. drop_params: true — Cowork/Code sessions send Anthropic-only
#      fields (cache_control, tool_reference, experimental beta
#      headers) that a non-Anthropic upstream rejects with HTTP 400.
#
# The api_key is read from the environment; start-desktop-proxy.sh sources
# ~/claude-source/deepseek-claude so ANTHROPIC_AUTH_TOKEN holds your
# Token Juice key (same secret the zim-claude CLI proxy uses).

model_list:
  # DeepSeek-V4.1-Flash behind an Opus-shaped name so the Desktop picker
  # accepts it and shows it as an Opus-tier model.
  #
  # additional_drop_params — обязателен для Claude Code >= 2.1.169.
  # Новый CLI всегда шлёт
  #     thinking: {"type": "adaptive", "display": "omitted"}
  # (adaptive thinking — фича моделей Anthropic 4.6+). LiteLLM решает,
  # выкидывать ли это поле, по своей карте моделей, а
  # `openai/deepseek-ai/DeepSeek-V4.1-Flash` ей неизвестен — поэтому поле
  # проходит насквозь в OpenAI-апстрим, который отвечает
  #     400 {"message":"Invalid request","type":"Bad Request"}
  # `drop_params: true` тут НЕ помогает: он выкидывает только те параметры,
  # которые LiteLLM опознал как чужие, а `thinking` он считает своим.
  # Проверено бисекцией: с `thinking` -> 400, без него -> 200.
  - model_name: claude-opus-5-5
    litellm_params:
      model: openai/deepseek-ai/DeepSeek-V4.1-Flash
      api_base: https://api.tokenjuice.ai/v1
      api_key: os.environ/ANTHROPIC_AUTH_TOKEN
      drop_params: true


  # --- Optional extra tiers -------------------------------------------------
  # Uncomment any of these to expose the SAME DeepSeek upstream under more
  # picker entries. Handy if a Cowork/Code background task asks for a
  # Sonnet- or Haiku-tier model by name.
  #
  # - model_name: claude-sonnet-4-5
  #   litellm_params:
  #     model: openai/deepseek-ai/DeepSeek-V4.1-Flash
  #     api_base: https://api.tokenjuice.ai/v1
  #     api_key: os.environ/ANTHROPIC_AUTH_TOKEN
  #     drop_params: true
  #
  # - model_name: claude-haiku-4-5
  #   litellm_params:
  #     model: openai/deepseek-ai/DeepSeek-V4.1-Flash
  #     api_base: https://api.tokenjuice.ai/v1
  #     api_key: os.environ/ANTHROPIC_AUTH_TOKEN
  #     drop_params: true

# --- Веб-поиск -------------------------------------------------------------
# Та же проблема, что и в CLI-прокси (:4000): апстрим не умеет серверный
# веб-поиск, а Claude Desktop шлёт инструмент web_search. LiteLLM
# перехватывает его, ищет сам через локальный SearxNG и отдаёт готовые
# результаты — апстрим неподдерживаемый инструмент не видит.
#
# enabled_providers обязателен: по умолчанию перехват только для bedrock,
# а модель выше объявлена как openai/... — без этой строки 400 возвращается.
#
# SearxNG: докер-контейнер `searxng`, порт 8888, ключи не нужны.
# Конфиг: ~/.config/zim-claude/searxng/settings.yml
search_tools:
  - search_tool_name: local-searxng
    litellm_params:
      search_provider: searxng
      api_base: http://127.0.0.1:8888

litellm_settings:
  # Belt-and-braces: strip unsupported params globally too.
  drop_params: true
  # Порядок важен: сначала наш колбэк вырезает Anthropic-only поля
  # (`thinking` и др.), которые апстрим отвергает с 400, и только потом
  # отрабатывает перехват веб-поиска.
  callbacks: ["drop_anthropic_only.proxy_handler_instance", "websearch_interception"]
  websearch_interception_params:
    search_tool_name: local-searxng
    enabled_providers: ["openai"]

general_settings:
  # Value Claude Desktop sends as "Gateway API key".
  # Set by start-desktop-proxy.sh (default: sk-claude-desktop-local).
  master_key: os.environ/CLAUDE_DESKTOP_LITELLM_KEY
